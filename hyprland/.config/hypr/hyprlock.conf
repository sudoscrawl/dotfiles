source = colors.conf

general {
    hide_cursor = true
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/gruvbox_forest-4.png

    color = rgb(000000)

    blur_size = 3
    blur_passes = 2
    noise = 0.008
    contrast = 1.05
    brightness = 0.65
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ─────────────────────────────────────────────
# TIME
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"

    color = rgb(ffffff)
    font_size = 108
    font_family = Adwaita Sans

    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.25)

    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"

    color = rgb(ffffff)
    font_size = 108
    font_family = Adwaita Sans

    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.25)

    position = 0, 50
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A')"

    color = rgb(ffffff)
    font_size = 17
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.20)

    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%d %b')"

    color = rgb(ffffff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.20)

    position = 0, -52
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────

label {
    monitor =
    text = $USER

    color = rgb(ffffff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.20)

    position = 0, 205
    halign = center
    valign = bottom
}

# ─────────────────────────────────────────────
# PASSWORD
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 260, 52
    outline_thickness = 1

    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    rounding = 26

    outer_color = rgb(ffffff)
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = rgb(ffffff)

    fade_on_empty = false

    placeholder_text =

    hide_input = false

    check_color = rgb(ffffff)
    fail_color = rgb(ffffff)

    fail_text =

    shadow_passes = 0

    position = 0, 105
    halign = center
    valign = bottom
}
